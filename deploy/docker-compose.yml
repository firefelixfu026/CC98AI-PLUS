services:
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/cc98_watch.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

