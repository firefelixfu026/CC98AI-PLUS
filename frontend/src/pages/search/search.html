<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CC98 AI+ 搜索</title>
  <style>
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--cc98-bg-sub,#eef4f7); }
    body { margin:0; min-height:100vh; color:var(--cc98-txt,#1a2b33); background:var(--cc98-bg-sub,#eef4f7); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .page-head { border-bottom:1px solid var(--cc98-bd,#dfeaef); background:var(--cc98-bg,#fff); }
    .page-head-inner { max-width:1120px; margin:0 auto; padding:24px 28px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; align-items:center; gap:13px; min-width:0; }
    .brand-icon { width:42px; height:42px; border-radius:11px; background:var(--cc98-pri-fill,#245d70); color:var(--cc98-on-pri,#fff); display:grid; place-items:center; flex:none; }
    .brand-icon svg { width:22px; height:22px; }
    h1 { margin:0; font-size:21px; line-height:1.3; font-weight:680; letter-spacing:0; }
    .subtitle { margin:4px 0 0; color:var(--cc98-txt2,#485e6a); font-size:13px; }
    .head-actions { display:flex; gap:9px; flex:none; }
    .page-action { border:1px solid var(--cc98-bd,#dfeaef); border-radius:9px; padding:9px 14px; background:var(--cc98-bg,#fff); color:var(--cc98-txt,#1a2b33); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; }
    .page-action:hover { border-color:var(--cc98-pri-bd,#b8d5de); background:var(--cc98-pri-soft,#eef8fb); color:var(--cc98-pri,#245d70); }
    .page-shell { max-width:1120px; margin:0 auto; padding:28px 28px 72px; }
    body #cc98-ai-panel.cc98-search-page { position:static; display:flex; width:100%; max-width:none; max-height:none; min-height:calc(100vh - 174px); overflow:visible; border-radius:14px; box-shadow:var(--cc98-sh,0 10px 36px rgba(20,50,62,.14)); }
    body #cc98-ai-panel.cc98-search-page .cc98-panel-body { overflow:visible; padding:26px 30px 38px; }
    body #cc98-ai-panel.cc98-search-page .cc98-form-row { position:sticky; top:0; z-index:3; margin:-6px -8px 14px; padding:6px 8px 12px; background:var(--cc98-bg,#fff); border-bottom:1px solid var(--cc98-bd-soft,#edf4f7); }
    body #cc98-ai-panel.cc98-search-page .cc98-input { font-size:15px; padding:12px 15px; }
    body #cc98-ai-panel.cc98-search-page .cc98-btn-primary,
    body #cc98-ai-panel.cc98-search-page .cc98-secondary { padding:12px 20px; }
    body #cc98-ai-panel.cc98-search-page .cc98-summary { font-size:15px; line-height:1.85; }
    body #cc98-ai-panel.cc98-search-page .cc98-src-title { white-space:normal; line-height:1.55; }
    body #cc98-ai-panel.cc98-search-page .cc98-result { max-width:940px; }
    @media (max-width:720px) {
      .page-head-inner { align-items:flex-start; padding:18px; }
      .head-actions { flex-direction:column; }
      .page-shell { padding:16px 12px 44px; }
      body #cc98-ai-panel.cc98-search-page .cc98-panel-body { padding:18px 16px 28px; }
      body #cc98-ai-panel.cc98-search-page .cc98-form-row { flex-wrap:wrap; }
      body #cc98-ai-panel.cc98-search-page .cc98-input { flex-basis:100%; }
    }
  </style>
</head>
<body>
  <header class="page-head">
    <div class="page-head-inner">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="M20 20l-4.6-4.6"></path>
            <path d="M10.5 7.2l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9.9-2.4z" fill="currentColor" stroke="none"></path>
          </svg>
        </span>
        <div>
          <h1>CC98 AI+ 搜索</h1>
          <p class="subtitle">适合阅读较长的总结与来源列表，搜索进度和悬浮窗保持同步。</p>
        </div>
      </div>
      <div class="head-actions">
        <button class="page-action" id="openCC98" type="button">打开 CC98</button>
        <button class="page-action" id="openSettings" type="button">搜索设置</button>
      </div>
    </div>
  </header>
  <div class="page-shell">
    <main id="cc98-ai-panel" class="cc98-search-page open">
      <div id="searchBody" class="cc98-panel-body"></div>
    </main>
  </div>
  <script type="module" src="search.js"></script>
</body>
</html>
